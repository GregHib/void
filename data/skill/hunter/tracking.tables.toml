[tracking]
level = "int"
level_default = 1
xp = "int"             # xp * 0.1
loot = "list<item>"
catch_anim = "anim"
limit = "int"          # maximum linking segments in a generated trail

[.polar_kebbit]
xp = 300
loot = ["raw_beast_meat", "polar_kebbit_fur", "bones"]
catch_anim = "noose_catch_polar"
limit = 3

[.common_kebbit]
level = 3
xp = 360
loot = ["common_kebbit_fur", "bones", "raw_beast_meat"]
catch_anim = "noose_catch_common"
limit = 3


# ---------------------------------------------------------------------------
# Trail segments — burrow marks a starting segment for that burrow object,
# trigger is the trail object inspected to advance (defaults to end)
# ---------------------------------------------------------------------------
[trails]
kebbit = "string"
varbit = "var"
tunnel = "boolean"
tunnel_default = false
inverted = "boolean"
inverted_default = false
start = "tile"
end = "tile"
trigger = "tile"
burrow = "obj"

