[tracking]
level = "int"
level_default = 1
xp = "int"             # xp * 0.1
loot = "list<item>"
catch_anim = "anim"
limit = "int"          # maximum linking segments in a generated trail
finals = "list<tile>"  # tiles of the attackable objects a trail can end at

[.polar_kebbit]
