# Furniture keyed by build menu item, objects are placed on the hotspot of the same piece, or the listed pieces
# Pieces without an object are left empty, as are tiles without one of the anchor pieces when listed
# Rotations are turns added to each objects hotspot rotation
# Variant is a player variable which picks the object instead of the piece
# Levels and xp from https://runescape.wiki/w/Construction historical room pages
[house_furniture]
row_id = "item"
level = "int"
xp = "int"
materials = "list<item>"
amounts = "list<int>"
nails = "int"
objects = "list<obj>"
pieces = "list<int>"
anchors = "list<int>"
rotations = "list<int>"
variant = "string"
# Item made at a workbench to build this furniture without materials
flatpack = "item"
# Furniture which has to already be built to upgrade into this
upgrade = "item"

