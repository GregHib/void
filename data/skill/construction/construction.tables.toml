# Furniture which can be built on each hotspot, hotspots with the same group are built and removed together
[house_hotspots]
row_id = "obj"
furniture = "list<item>"
group = "string"
piece = "int"
clone = "clone"

[.garden_centrepiece_space]
furniture = ["exit_portal", "decorative_rock", "pond", "imp_statue", "dungeon_entrance"]

[.parlour_chair_space]
furniture = ["crude_wooden_chair", "wooden_chair", "rocking_chair", "oak_chair", "oak_armchair", "teak_armchair", "mahogany_armchair"]

[.parlour_chair_space_2]
clone = "parlour_chair_space"

[.parlour_chair_space_3]
clone = "parlour_chair_space"

[.parlour_rug_space_corner]
furniture = ["brown_rug", "rug", "opulent_rug"]
group = "parlour_rug"

[.parlour_rug_space_side]
clone = "parlour_rug_space_corner"
piece = 1

[.parlour_rug_space_middle]
clone = "parlour_rug_space_corner"
piece = 2

[.parlour_bookcase_space]
furniture = ["wooden_bookcase", "oak_bookcase", "mahogany_bkcase"]

[.parlour_bookcase_space_2]
clone = "parlour_bookcase_space"

[.parlour_fireplace_space]
furniture = ["clay_fireplace", "stone_fireplace", "marble_fireplace"]

[.parlour_curtain_space]
furniture = ["torn_curtains", "curtains", "opulent_curtains"]

