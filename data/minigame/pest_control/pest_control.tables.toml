# https://runescape.wiki/w/Pest_Control
[pest_control_landers]
combat = "int"
boat = "tile"
exit = "tile"
points = "int"
tier = "int"
portal_hitpoints = "int"

[.novice]
combat = 40
boat = { x = 2661, y = 2639 }
exit = { x = 2657, y = 2639 }
points = 3
tier = 0
portal_hitpoints = 2000

[.intermediate]
combat = 70
boat = { x = 2640, y = 2644 }
exit = { x = 2644, y = 2644 }
points = 4
tier = 1
portal_hitpoints = 2500

[.veteran]
combat = 100
boat = { x = 2634, y = 2653 }
exit = { x = 2638, y = 2653 }
points = 5
tier = 2
portal_hitpoints = 2500

# Spawn positions on the original island (region 10536), offset into each game's instance
[pest_control_portals]
shielded = "npc"
portal = "npc"
tile = "tile"
name = "string"

[.purple]
shielded = "portal_shield_purple"
portal = "portal_purple"
tile = { x = 2628, y = 2591 }
name = "purple, western"

[.blue]
shielded = "portal_shield_blue"
portal = "portal_blue"
tile = { x = 2680, y = 2588 }
name = "blue, eastern"

[.yellow]
shielded = "portal_shield_yellow"
portal = "portal_yellow"
tile = { x = 2669, y = 2570 }
name = "yellow, south-eastern"

[.red]
shielded = "portal_shield_red"
portal = "portal_red"
tile = { x = 2645, y = 2569 }
name = "red, south-western"

# Monster tiers from weakest to strongest; novice uses tiers 1-3, intermediate 2-4 and veteran 3-5
[pest_control_monsters]
tiers = "list<npc>"

[.splatter]
tiers = ["splatter_level_22", "splatter_level_33", "splatter_level_44", "splatter_level_54", "splatter_level_65"]

[.shifter]
tiers = ["shifter_level_38", "shifter_level_57", "shifter_level_76", "shifter_level_90", "shifter_level_104"]

[.ravager]
tiers = ["ravager_level_36", "ravager_level_53", "ravager_level_71", "ravager_level_89", "ravager_level_106"]

[.spinner]
tiers = ["spinner_level_36", "spinner_level_55", "spinner_level_74", "spinner_level_88", "spinner_level_92"]

[.torcher]
tiers = ["torcher_level_33", "torcher_level_49", "torcher_level_66", "torcher_level_79", "torcher_level_91"]

[.defiler]
tiers = ["defiler_level_33", "defiler_level_50", "defiler_level_66", "defiler_level_80", "defiler_level_97"]

[.brawler]
