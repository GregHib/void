# Skill names players use, what bots say they're doing and training advice.
# `activity` and `advice` are quick chat phrases, `spots` are [min level, quick chat enum value] for the advice <MultipleChoice>
# `tips` are [min level, phrase] for advice phrases without a slot.
[chat_skills]
aka = "list<string>"
activity = "string"
advice = "string"
spots = "list<pair<int, string>>"
tips = "list<pair<int, string>>"

[.attack]
aka = ["att", "atk"]
advice = "Try training on: <MultipleChoice>."
