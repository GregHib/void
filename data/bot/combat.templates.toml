[kill_giant_rats]
requires = [
    { skill = { id = "$skill", min = 1, max = 5 } },
]
setup = [
    { equipment = { weapon = { id = "bronze_sword,bronze_dagger,bronze_scimitar" } } },
    { area = { id = "$location" } },
    { inventory = { id = "empty", min = 27 } },
]
actions = [
    { interface = { option = "Select", id = "combat_styles:$style" } },
    { npc = { option = "Attack", id = "giant_rat*", delay = 5, success = { inventory = { id = "empty", max = 0 } } } },
]
reactive = [
    { eat = { heal_percent = 20 } }
]
produces = [
    { item = "raw_rat_meat" },
    { item = "bones" },
    { skill = "$skill" }
]

