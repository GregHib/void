# The 634 client's Owned Bots plugin: what the server shows a player of their own bots (content/bot/owned/OwnedBots.kt).
# Ids past the cache's varcs (1436), inside the range the Void client keeps (up to 2435). Ints only: the client does not
# extend varcstrings. Sent only after the plugin's `::bot ui` handshake, so a vanilla client never receives them. Not saved.

# version << 12 | alive mask << 4 | online mask (one bit per slot); 0 when the plugin is not active
[owned_bots_meta]
id = 2000
format = "int"

# ---- slot 0 ----
# the bot's name, base-37, high half
[owned_bot_0_name_hi]
id = 2001
format = "int"

# the bot's name, base-37, low half
[owned_bot_0_name_lo]
id = 2002
format = "int"

# current << 16 | max (life points)
[owned_bot_0_hp]
id = 2003
format = "int"

# current << 16 | max
[owned_bot_0_prayer]
id = 2004
format = "int"

# OwnedBotStatus ordinal
[owned_bot_0_status]
id = 2005
format = "int"

# aggression << 12 | profile << 8 | task index (owned.tasks.toml order, 255 = none)
