# Tasks a player can give their owned bots (content/bot/owned/OwnedTasks.kt). Each maps to a world-bot activity from
# a *.bots.toml file; the bot loops it, banking at the nearest bank between trips, until told to stop. Every task ends
# with items in the owner's bank: no "train a skill" tasks, no unsupervised combat. Level and members requirements come
# from the activity itself (skill maximums are ignored for owned bots). Order here is the index the plugin sees.

[chop_logs]
label = "Chop logs (Draynor)"
activity = "draynor_north_trees"

