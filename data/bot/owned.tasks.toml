[catherby_lobster_fishing]
label = "Cage lobsters"

[catherby_tuna_swordfish_fishing]
label = "Harpoon tuna and swordfish"

[catherby_shark_fishing]
label = "Harpoon sharks"

[seers_village_flax_picking]
label = "Pick flax"

[seers_village_flax_spinning]
label = "Spin flax into bowstrings"

[lumbridge_pickpocketing]
label = "Pickpocket men and women"
