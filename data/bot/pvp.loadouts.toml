# PvP loadouts worn by Clan Wars bots, one per pvp_* template in minigame_combat.templates.toml.
# The inventory holds food, potions, spec weapons, ammo, runes and the games necklace used to retreat.

[pvp_zerker]
weapon = { id = "abyssal_whip" }
chest = { id = "fighter_torso" }
legs = { id = "rune_platelegs" }
hat = { id = "helm_of_neitiznot" }
feet = { id = "dragon_boots" }
amulet = { id = "amulet_of_fury" }
ring = { id = "berserker_ring" }
cape = { id = "obsidian_cape" }
inventory = [
    { id = "shark", min = 16 },
    { id = "super_restore_4", min = 2 },
    { id = "super_attack_4", min = 1 },
    { id = "super_strength_4", min = 1 },
    { id = "super_defence_4", min = 1 },
    { id = "dragon_dagger_p++", min = 1, equippable = true },
