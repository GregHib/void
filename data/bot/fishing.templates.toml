[fish_crayfish]
requires = [
    { skill = { id = "fishing", min = 1 } },
]
setup = [
    { inventory = [
        { id = "crayfish_cage" },
        { id = "empty", min = 27 }
    ] },
    { area = { id = "$location" } },
]
actions = [
    { npc = { option = "Cage", id = "$spot", delay = 5, success = { inventory = { id = "empty", max = 0 } } } },
]
produces = [
    { item = "raw_crayfish" },
    { skill = "fishing" }
]

[fish_small_net]
setup = [
    { inventory = [
        { id = "small_fishing_net" },
        { id = "empty", min = 27 }
    ] },
    { area = { id = "$location" } },
]
actions = [
    { npc = { option = "Net", id = "$spot", delay = 5, success = { inventory = { id = "empty", max = 0 } } } },
]
produces = [
    { item = "raw_shrimp" },
    { item = "raw_anchovies" },
    { skill = "fishing" }
]

[fish_bait]
setup = [
    { inventory = [
        { id = "fishing_rod" },
        { id = "feather", min = 52 },
        { id = "empty", min = 25 }
    ] },
    { area = { id = "$location" } },
]
actions = [
    { npc = { option = "Bait", id = "$spot", delay = 5, success = { inventory = { id = "empty", max = 0 } } } },
]
produces = [
    { skill = "fishing" },
]

[fish_bank_template]
requires = [{ skill = { id = "fishing", min = "$level" } }]
setup = [
    { inventory = [{ id = "$tool" }, { id = "empty", min = 27 }] },
    { area = { id = "$location" } },
]
actions = [
    { npc = { option = "$option", id = "$spot", delay = 5, success = { inventory = { id = "empty", max = 0 } } } },
    { go_to = { area = "$bank_area" } },
    { npc = { option = "Bank", id = "$bank_npc", success = { interface_open = { id = "bank" } } } },
    { interface = { option = "Deposit-All", id = "bank_side:inventory:$catch1", success = { inventory = { id = "$catch1", max = 0 } } } },
    { interface = { option = "Deposit-All", id = "bank_side:inventory:$catch2", success = { inventory = { id = "$catch2", max = 0 } } } },
    { interface_close = { id = "bank" } },
    { go_to = { area = "$location" } },
]
produces = [{ item = "$catch1" }, { item = "$catch2" }, { skill = "fishing" }]

