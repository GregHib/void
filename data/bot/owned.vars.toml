# Player-owned bots: the owner's roster, saved with the owner (content/bot/owned/OwnedBots.kt).
# One block per slot 0-3. A bot is "alive" from purchase until it dies; its items live on the bot while it is
# spawned and in the owner's bank otherwise. `items` is the crash-safety snapshot of what the bot is carrying,
# cleared by every sweep; a non-empty value at login means the server stopped without sweeping.

[owned_bot_0_name]
format = "string"
persist = true

[owned_bot_0_alive]
format = "boolean"
persist = true

[owned_bot_0_profile]
format = "string"
persist = true

[owned_bot_0_aggression]
format = "string"
persist = true

[owned_bot_0_knobs]
format = "string"
persist = true

[owned_bot_0_items]
format = "string"
persist = true

