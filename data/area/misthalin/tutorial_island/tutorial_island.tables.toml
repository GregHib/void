title = ""
lines = ["Your final instructor!", "You're almost finished on tutorial island. Pass through the", "door to find the path leading to your final instructor.", ""]
hint_tile = { x = 3122, y = 3102 }
hint_height = 125

# TALK_TO_MAGIC_INSTRUCTOR
[.stage_63]
title = "Your final instructor!"
lines = ["Just follow the path to the Wizard's house, where you will be", "shown how to cast spells. Just talk with the mage indicated to", "find out more.", ""]
hint_npc = "magic_instructor"

# OPEN_MAGIC_TAB
