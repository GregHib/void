title = "Open up your final menu."
lines = ["", "Open up the Magic menu by clicking on the flashing icon next", "to the Prayer button you just learned about.", ""]
flash = "MagicSpellbook"
unlock = "modern_spellbook"

# TALK_TO_MAGIC_INSTRUCTOR_2
[.stage_65]
title = ""
