# Each climbable rock face, per side. A path ending the climb down has a single tile; delay, face, anim_delay and loops only apply when climbing down
[elven_overpass]
tile = "tile"
level = "int"
path = "list<tile>"
delay = "int"
face = "string"
anim_delay = "int"
loops = "int"
loops_default = 8

