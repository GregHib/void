# Cache dump names varbit 346 'golem_a', but the repo already ships it as
# 'the_golem' and RugMerchant's questCompleted("the_golem") depends on that.
# Values are read by the temple door (object 6310): 0-4 show the sealed door
# (6363) and 5-10 the openable portal (6364).
[the_golem]
id = 346
persist = true
format = "map"
default = "unstarted"
values = {
    unstarted = 0,
    repair_golem = 1,
    open_portal = 2,
    find_statuette = 3,
    statuette_replaced = 4,
    portal_opened = 5,
    demon_dead = 6,
    convince_golem = 7,
    completed = 10,
}

[golem_b]
id = 347
persist = true
format = "int"

