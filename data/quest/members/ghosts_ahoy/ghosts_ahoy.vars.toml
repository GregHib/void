# Toy boat flag colours — set when the player dyes their model_ship_silk in the various combinations.
[ahoy_toy_top]
persist = true
format = "int"

[ahoy_toy_skull]
persist = true
format = "int"

[ahoy_toy_bottom]
persist = true
format = "int"

# Mast flag colours — randomised at quest start so the player has to inspect the in-game mast.
[ahoy_mast_top]
persist = true
format = "int"

[ahoy_mast_skull]
persist = true
format = "int"

[ahoy_mast_bottom]
persist = true
format = "int"

