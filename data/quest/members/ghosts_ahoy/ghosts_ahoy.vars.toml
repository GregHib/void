[ahoy_player_runedraw_turn]
persist = false
format = "int"

[ahoy_player_runedraw_sum]
persist = false
format = "int"

[ahoy_robin_runedraw_turn]
persist = false
format = "int"

[ahoy_robin_runedraw_sum]
persist = false
format = "int"
