# Otto's lessons are added to the journal as they are told, BarbarianSkillsBook combines them per player
[barbarian_skills]
title = "What Otto told me."
type = "long"
pages = [
    [
        "I have noted down what Otto",
        "has told me in this journal, so",
        "that I may not forget my",
        "tasks. His instructions are",
        "thus faithfully recorded for",
        "posterity.",
    ],
]

[barbarian_skills_rod]
pages = [
    [
        "<navy>Otto's words on Fishing with",
        "<navy>rods",
        "",
        "'While you civilised folk use",
        "small, weak fishing rods, we",
        "barbarians are skilled with",
        "heavier tackle. We fish in the",
        "lake nearby. Take the rod",
        "from under my bed in my",
        "dwelling and fish in the lake.",
        "When you have caught a few",
        "fish I am sure you will be",
        "able to talk more with me.",
        "You will know when you are",
        "ready since my inspiration",
        "will fill your mind. We do not",
        "use these fish quite as you",
        "might expect. When you",
        "return from Fishing we can",
        "speak of this matter.'",
    ],
    [
        "'Your mind is as clear as the",
        "waters you have fished. This",
        "is good. These are fish that",
        "are fat with eggs rather than",
        "fat with flesh; this is what we",
        "will make use of.'",
    ],
]

[barbarian_skills_barehand]
pages = [
    [
        "<navy>Otto's words on Fishing",
        "<navy>without harpoons",
        "",
        "'First you must know more",
        "of harpoons with fish that are",
        "usually caught with such a",
        "device. You must catch fish",
        "which are usually harpooned,",
        "without a harpoon. You will",
        "be using your skill and",
        "strength. Use your arm as",
        "bait. Wriggle you fingers as",
        "if they are a tasty snack and",
        "hungry tuna and swordfish",
        "will throng to be caught by",
        "you. The method also works",
        "with shark - though in this",
        "case the action must be more",
        "of a frenzied thrashing of the",
        "arm than wiggling.'",
    ],
    [
        "'I sense you have more",
        "understanding of spears",
        "through your studies.'",
    ],
]

[barbarian_skills_bow]
pages = [
    [
        "<navy>Otto's words on Firemaking",
        "",
        "'The first point in your",
        "progression is that of lighting",
        "fires without a tinderbox. For",
        "this process you will require a",
        "strung bow. You use the bow",
        "to quickly rotate pieces of",
        "wood against one another. As",
        "you rub the wood becomes",
        "hot, eventually springing into",
        "flame. The spirits will aid you,",
        "the power they supply you",
        "will guide your hands. Go",
        "benefit from their guidance",
        "upon an oaken log.'",
    ],
    [
        "'Firemaking with your bow",
        "worked - fine news indeed,",
        "secrets our spirit boats now",
        "await your attention.'",
    ],
]

[barbarian_skills_herblore]
pages = [
    [
        "<navy>Otto's words on potion",
        "<navy>enhancement",
        "",
        "'If you use a knife upon a",
        "fat fish, several new fishy",
        "items will be produced. Fish",
        "parts can be used as bait; the",
        "roe or caviar is more useful",
        "for us. Mixing these items",
        "with two dose potions is what",
        "should be performed. This",
        "results in nutritious slop,",
        "perfect for healing as well as",
        "imparting the effect of the",
        "potion. Roe can be used for",
        "some more easily combined",
        "mixes, while caviar may be",
        "used for any mixes of which",
        "I am aware. You will discover",
        "you will be able to decant a",
        "four dose potion into an",
        "empty vial, thus giving two",
        "potions of two doses. This will",
        "aid you in the process. In",
        "this case I in fact require a",
        "potion for my own stocks.",
        "Bring a lesser attack potion",
        "combined with fish roe.'",
    ],
    [
        "'I see you have my potion. I",
        "will say no more than that I",
        "am eternally grateful.'",
    ],
]

[barbarian_skills_spear]
pages = [
    [
        "<navy>Otto's words on Smithing",
        "<navy>spears",
        "",
        "'Many warriors complain that",
        "spears are difficult to find, we",
        "barbarians thus forge our",
        "own. If you use our special",
        "barbarian anvil here, you will",
        "find it ideal. Other forges are",
        "not sturdy enough or for the",
        "forging work involved. Make",
        "any of our spears and",
        "return. Note well that you",
        "will require wood for the",
        "spear shafts, the quality of the",
        "wood must be similar to that",
        "of the metal involved.'",
    ],
    [
        "'The manufacture of spears is",
        "now yours as a speciality.",
        "Use your skill well. In",
        "addition, I am ready to reveal",
        "more spear-related crafts.'",
    ],
]

[barbarian_skills_pyre]
pages = [
    [
        "<navy>Otto's words on Crafting",
        "<navy>pyre ships",
        "",
        "'The next step is quite",
        "complex so listen well. In",
        "order to send our ancestors",
        "into the spirit world, their",
        "mortal remains must be",
        "burned with due ceremony.",
        "This can only be performed",
        "close to the water on the",
        "shore of the lake, just to our",
        "north-east. You will recognise",
        "the correct places by the",
        "ashes to be seen there. You",
        "will need to construct a small",
        "ship with logs in this area, the",
        "add the bones of a long dead",
        "barbarian hero. From the",
        "caverns beneath this lake.",
        "Many of our ancestors",
        "travelled to these caverns in",
        "order to hunt for glory and",
        "only found death. Their",
        "bones must still lie inside,",
        "their spirits trapped in",
        "torment. The spirit will",
        "ascend to glory, the pyre will",
        "send the earthly remains to",
        "the depths. You will also",
        "obtain a closer link to the",
        "spirit world. During this",
        "heightened contact, any bones",
        "you bury will have increased",
        "importance to the gods. The",
        "number of bones buried,",
        "before the link fades, is",
        "increased with the difficulty of",
        "obtaining the wood which you",
        "use. I have little knowledge of",
        "the caverns, they are blocked",
        "from the sight of spirits with",
        "whom I commune. I can",
        "only suspect that whatever",
        "slew barbarians heroes is",
        "indeed mighty. I also suggest",
        "that these bones may be very",
        "uncommon, since heroes are",
        "not found in vast numbers.",
        "Good luck. Dive into the",
        "whirlpool in the lake to the",
        "east. The spirits will use their",
        "abilities to ensure you arrive",
        "in the correct location.",
        "Though their influence fades",
        "so you must find your own",
        "way out.'",
    ],
]

[barbarian_skills_hasta]
pages = [
    [
        "<navy>Otto's words on one-handed",
        "<navy>spears",
        "",
        "'The next step up is to",
        "manufacture a one handed",
        "version of a spear, suitable",
        "for combat. Such a spear is",
        "known as a hasta. As you",
        "might suspect, our ways",
        "require greater",
        "understanding than is gained",
        "by looking at a weapon. It is",
        "also the case that the process",
        "involves a differently balanced",
        "spear. Before you use such a",
        "weapon in anger you must",
        "make an example. Only then",
        "will you understand the poise",
        "of the techniques involved.",
        "You may use our special",
        "anvil for this spear type too.",
        "As the ways of black and",
        "dragon are beyond our",
        "knowledge, however, these",
        "spears may not be created.'",
    ],
    [
        "'I see you have constructed",
        "your hasta, and are",
        "approaching readiness to live",
        "life to its fullest - that you",
        "may be a peaceful spirit when",
        "your time ends.'",
    ],
]

# One ancient page per side, BarbarianNotes hides the ones not yet copied
